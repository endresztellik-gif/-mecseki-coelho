<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd6e7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e6d6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6e6ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <!-- Book symbol -->
  <rect x="156" y="128" width="200" height="256" rx="8" fill="#ffffff" opacity="0.9"/>
  <line x1="256" y1="128" x2="256" y2="384" stroke="#e6d6ff" stroke-width="3"/>

  <!-- Decorative stars -->
  <text x="256" y="220" font-size="80" text-anchor="middle" fill="#d6e6ff">🎭</text>

  <!-- Text -->
  <text x="256" y="440" font-size="32" font-weight="bold" text-anchor="middle" fill="#666" font-family="serif">MC</text>
</svg>
